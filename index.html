<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ShortURL + QR</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 60px auto;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #666;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-top: 20px;
      font-size: 16px;
    }

    button {
      margin-top: 15px;
      padding: 12px 25px;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      margin-top: 30px;
    }

    #qrResult img {
      width: 250px;
      height: 250px;
    }

    .short-url {
      font-size: 20px;
      font-weight: bold;
      margin: 15px 0;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <h1>ShortURL + QR</h1>

  <p>สร้าง Short URL และ QR Code จากลิงก์ของคุณ</p>

  <input
    type="url"
    id="longUrl"
    placeholder="วาง URL ที่ต้องการย่อที่นี่"
  >

  <br>

  <button onclick="createShortUrl()">
    สร้าง Short URL + QR
  </button>

  <div id="result"></div>


  <script>

    // URL ของ Google Apps Script Web App
    const API_URL =
      "https://script.google.com/macros/s/AKfycbyX4QKp8avHVhcmALKy6VrTcopjpLX4c8PbXqX0pNis6RMDLy7eSmNka6NdEiylzopWfw/exec";


    async function createShortUrl() {

      const url =
        document.getElementById("longUrl").value.trim();

      if (!url) {
        alert("กรุณาใส่ URL ก่อนค่ะ");
        return;
      }


      document.getElementById("result").innerHTML =
        "<p>กำลังสร้าง Short URL...</p>";


      try {

        const response = await fetch(API_URL, {

          method: "POST",

          body: JSON.stringify({
            longUrl: url,
            title: ""
          })

        });


        const data = await response.json();


        if (!data.success) {

          throw new Error(
            data.error || "เกิดข้อผิดพลาด"
          );

        }


        // ตอนนี้เรายังใช้ URL แบบชั่วคราว
        // เพื่อทดสอบว่า Code ที่ได้กลับมาทำงานจริง
        const shortCode = data.code;


        // QR ตอนนี้ยัง encode Code อย่างเดียว
        // เดี๋ยว Step ถัดไปเราจะเปลี่ยนเป็น Short URL จริง
        const qrUrl =
          "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data="
          + encodeURIComponent(shortCode);


        document.getElementById("result").innerHTML = `

          <h3>สร้างสำเร็จ 🎉</h3>

          <p>Short Code</p>

          <div class="short-url">
            ${shortCode}
          </div>

          <div id="qrResult">
            <img
              src="${qrUrl}"
              alt="QR Code"
            >
          </div>

          <p>
            URL ต้นฉบับ:<br>
            ${url}
          </p>

        `;


      } catch (error) {

        console.error(error);

        document.getElementById("result").innerHTML = `

          <p style="color:red;">
            เกิดข้อผิดพลาด: ${error.message}
          </p>

        `;

      }

    }

  </script>

</body>
</html>
