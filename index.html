<!DOCTYPE html>

<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Short URL + QR Code</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 20px;
      text-align: center;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0;
      font-size: 16px;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    #result {
      margin-top: 30px;
    }

    #shortUrl {
      display: inline-block;
      margin: 10px 0 20px;
      font-size: 18px;
      word-break: break-all;
    }

    #qrCode {
      width: 250px;
      height: 250px;
      margin-top: 10px;
    }

    .error {
      color: #b00020;
    }
  </style>

</head>

<body>

  <h1>สร้าง Short URL</h1>

<input
type="url"
id="longUrl"
placeholder="วาง Long URL ที่นี่"

>

<input
type="text"
id="title"
placeholder="ชื่อ/รายละเอียด (ถ้ามี)"

>

  <button id="createButton" onclick="createShortUrl()">
    สร้าง Short URL
  </button>

  <div id="result"></div>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbyX4QKp8avHVhcmALKy6VrTcopjpLX4c8PbXqX0pNis6RMDLy7eSmNka6NdEiylzopWfw/exec";

    function createShortUrl() {
      const longUrl =
        document.getElementById("longUrl").value.trim();
      let finalUrl = longUrl;

    if (!/^https?:\/\//i.test(finalUrl)) {
    finalUrl = "https://" + finalUrl;
    }

      const title =
        document.getElementById("title").value.trim();

      const result =
        document.getElementById("result");

      const button =
        document.getElementById("createButton");

      if (!longUrl) {
        result.innerHTML =
          '<p class="error">กรุณาใส่ Long URL ก่อนค่ะ</p>';
        return;
      }

      button.disabled = true;
      result.innerHTML =
        "<p>กำลังสร้าง Short URL...</p>";

      const callbackName =
        "createCallback_" + Date.now();

      const requestId =
        "REQ-" + Date.now();

      window[callbackName] = function(data) {
        console.log("Create result:", data);

        delete window[callbackName];

        const script =
          document.getElementById(callbackName);

        if (script) {
          script.remove();
        }

        button.disabled = false;

        if (data.success && data.code) {

          const shortCode = data.code;

          const shortUrl =
            "https://mcintraining.github.io/shorturl-qr/" +
            shortCode;

          const qrUrl =
            "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=" +
            encodeURIComponent(shortUrl);

          result.innerHTML = `
            <h2>สร้างสำเร็จค่ะ 🎉</h2>

            <p><strong>Short URL</strong></p>

           <div>
<a id="shortUrl" href="${shortUrl}" target="_blank">
${shortUrl}
</a>
</div>

<button type="button" onclick="copyShortUrl('${shortUrl}')">
📋 Copy Short URL
</button>

            <div>
              <img
                id="qrCode"
                src="${qrUrl}"
                alt="QR Code"
              >
            </div>

            <p>
              สแกน QR Code เพื่อเปิด Short URL
            </p>
          `;

        } else {

          result.innerHTML =
            '<p class="error">สร้าง Short URL ไม่สำเร็จค่ะ</p>';
        }
      };

      const script =
        document.createElement("script");

      script.id = callbackName;

      script.src =
        API_URL +
        "?longUrl=" +
        encodeURIComponent(finalUrl) +
        "&title=" +
        encodeURIComponent(title) +
        "&requestId=" +
        encodeURIComponent(requestId) +
        "&callback=" +
        encodeURIComponent(callbackName);

      script.onerror = function() {

        delete window[callbackName];

        button.disabled = false;

        result.innerHTML =
          '<p class="error">ไม่สามารถเชื่อมต่อระบบได้ค่ะ กรุณาลองใหม่</p>';
      };

      document.body.appendChild(script);
    }

    function copyShortUrl(url) {
navigator.clipboard.writeText(url)
.then(function() {
alert("คัดลอก Short URL แล้วค่ะ 🎉");
})
.catch(function() {
alert("คัดลอกไม่สำเร็จค่ะ กรุณาคัดลอกลิงก์ด้วยตัวเอง");
});
}
    
  </script>

</body>
</html>
