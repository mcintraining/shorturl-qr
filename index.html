<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Short URL + QR</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      margin-top: 30px;
      text-align: center;
    }

    #qr {
      margin-top: 20px;
    }

    .error {
      color: red;
    }
  </style>
</head>

<body>

  <h1>Short URL + QR</h1>

  <input
    type="url"
    id="urlInput"
    placeholder="วาง URL ที่ต้องการย่อ"
  >

  <button onclick="createShortUrl()">
    สร้าง Short URL
  </button>

  <div id="result"></div>

  <script>

    const API_URL =
      "https://script.google.com/macros/s/AKfycbyX4QKp8avHVhcmALKy6VrTcopjpLX4c8PbXqX0pNis6RMDLy7eSmNka6NdEiylzopWfw/exec";


    function createShortUrl() {

 const button = document.querySelector("button");

  button.disabled = true;
  button.textContent = "กำลังสร้าง...";

  const url = document.getElementById("urlInput").value.trim();
      
      if (!url) {
        alert("กรุณาใส่ URL ก่อนค่ะ");
        return;
      }

      document.getElementById("result").innerHTML =
        "กำลังสร้าง Short URL...";


      // สร้างชื่อ callback แบบสุ่ม
      const callbackName =
        "shortUrlCallback_" + Date.now();
const requestId = "REQ-" + Date.now();
console.log("REQUEST ID:", requestId);

      // สร้าง function สำหรับรับข้อมูลกลับจาก Apps Script
      window[callbackName] = function(data) {

        // ลบ callback หลังใช้งาน
        delete window[callbackName];


        // ลบ script ที่สร้างขึ้น
        const script = document.getElementById(callbackName);

        if (script) {
          script.remove();
        }


        // ถ้าเกิด error
        if (!data.success) {

          document.getElementById("result").innerHTML =
            '<div class="error">เกิดข้อผิดพลาด: ' +
            data.error +
            '</div>';

          return;
        }


        // ได้ Code แล้ว
        const shortCode = data.code;


        // ตอนนี้ยังใช้แค่ Code เพื่อทดสอบ
        document.getElementById("result").innerHTML =
          "<p><strong>สร้างสำเร็จค่ะ 🎉</strong></p>" +
          "<p>Short Code:</p>" +
          "<h2>" + shortCode + "</h2>";
      };


      // สร้าง URL สำหรับ JSONP
      const script = document.createElement("script");

script.id = callbackName;

script.src =
  API_URL +
  "?callback=" + encodeURIComponent(callbackName) +
  "&longUrl=" + encodeURIComponent(url) +
  "&requestId=" + encodeURIComponent(requestId);

      
script.onload = function() {
  console.log("JSONP script โหลดสำเร็จ");
};

script.onerror = function() {
  console.log("JSONP script โหลดไม่สำเร็จ");
};

document.body.appendChild(script);

    }

  </script>

</body>
</html>
