<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>กำลังเปิด link...</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;

      font-family: Arial, sans-serif;

      background:
        linear-gradient(
          135deg,
          #fff7fb 0%,
          #f8f5ff 50%,
          #f2fbff 100%
        );

      color: #555;
    }

    .loading-card {
      width: 100%;
      max-width: 390px;

      padding: 42px 28px 34px;

      text-align: center;

      background: rgba(255, 255, 255, 0.94);

      border: 2px solid #eee4f5;

      border-radius: 28px;

      box-shadow:
        0 8px 30px rgba(150, 130, 170, 0.10),
        0 2px 8px rgba(150, 130, 170, 0.06);

      animation: cardAppear 0.5s ease-out;
    }

    .cute-icon {
      font-size: 48px;

      display: inline-block;

      animation: float 1.8s ease-in-out infinite;
    }

    .loading-title {
      margin-top: 16px;

      font-size: 21px;
      font-weight: 700;

      color: #685878;
    }

    .loading-message {
      margin-top: 12px;

      min-height: 24px;

      font-size: 15px;
      line-height: 1.6;

      color: #8b7b94;

      transition: opacity 0.25s ease;
    }

    .dots {
      margin-top: 18px;

      display: flex;
      justify-content: center;
      align-items: center;

      gap: 7px;
    }

    .dots span {
      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #c7a9d8;

      animation: bounce 1.2s infinite ease-in-out;
    }

    .dots span:nth-child(2) {
      background: #d8b8d9;
      animation-delay: 0.15s;
    }

    .dots span:nth-child(3) {
      background: #b8cce3;
      animation-delay: 0.3s;
    }

    .elapsed {
      margin-top: 14px;

      font-size: 12px;

      color: #b0a5b5;
    }

    .little-note {
      margin-top: 22px;

      padding-top: 15px;

      border-top: 1px dashed #eadfea;

      font-size: 12px;

      color: #aaa0ac;
    }

    @keyframes bounce {
      0%, 60%, 100% {
        transform: translateY(0);
      }

      30% {
        transform: translateY(-7px);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 480px) {
      .loading-card {
        padding: 36px 22px 30px;
        border-radius: 24px;
      }

      .loading-title {
        font-size: 19px;
      }

      .loading-message {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="loading-card">

    <div class="cute-icon">🐾</div>

    <div class="loading-title">
      กำลังเปิด link...
    </div>

    <div class="loading-message" id="loadingMessage">
      กำลังเปิด link ให้ค่ะ ✧｡٩(ˊᗜˋ )و✧*｡
    </div>

    <div class="dots">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="elapsed" id="elapsed">
      0 วินาที
    </div>

    <div class="little-note">
      ไม่ได้ค้างนะคะ กำลังทำงานอยู่ค่ะ (・v・;)ゞ
    </div>

  </div>


  <script>

    // ==================================================
    // API
    // ==================================================

    const API_URL =
      "https://script.google.com/macros/s/AKfycbyX4QKp8avHVhcmALKy6VrTcopjpLX4c8PbXqX0pNis6RMDLy7eSmNka6NdEiylzopWfw/exec";


    // ==================================================
    // อ่าน Short Code จาก URL
    // ==================================================

    const path =
      window.location.pathname;

    const pathParts =
      path.split("/").filter(Boolean);

    const code =
      pathParts.length
        ? pathParts[pathParts.length - 1]
        : "";


    console.log(
      "Short code:",
      code
    );


    // ==================================================
    // Elements
    // ==================================================

    const loadingMessage =
      document.getElementById(
        "loadingMessage"
      );

    const elapsedElement =
      document.getElementById(
        "elapsed"
      );


    // ==================================================
    // ตัวแปรควบคุมการทำงาน
    // ==================================================

    const startTime =
      Date.now();


    let finished =
      false;


    let currentScript =
      null;


    let attemptTimeout =
      null;


    let retryTimer =
      null;


    let callbackCounter =
      0;


    let attemptNumber =
      0;


    // ==================================================
    // การตั้งค่า
    // ==================================================

    // แต่ละ request ให้เวลาสูงสุด 8 วินาที
    const REQUEST_TIMEOUT =
      8000;


    // เว้นช่วงก่อนลอง request ใหม่
    const RETRY_DELAY =
      1000;


    // เวลารวมสูงสุดก่อนแสดง error
    const TOTAL_TIMEOUT =
      45000;


    // ==================================================
    // Loading Message
    // ==================================================

    function updateLoadingMessage() {

      if (finished) {
        return;
      }


      const seconds =
        Math.floor(
          (Date.now() - startTime) / 1000
        );


      elapsedElement.textContent =
        seconds + " วินาที";


      if (seconds < 12) {

        loadingMessage.textContent =
          "กำลังเปิด link ให้ค่ะ ✧｡٩(ˊᗜˋ )و✧*｡";

      } else if (seconds < 24) {

        loadingMessage.textContent =
          "กำลังเตรียมหน้าเว็บให้ค่ะ ✧｡٩(ˊᗜˋ )و✧*｡";

      } else if (seconds < 36) {

        loadingMessage.textContent =
          "ยังดำเนินการอยู่ค่ะ อีกนิดเดียวนะคะ ✧｡٩(ˊᗜˋ )و✧*｡";

      } else {

        loadingMessage.textContent =
          "ระบบใช้เวลานานกว่าปกตินิดหน่อยค่ะ ✧｡٩(ˊᗜˋ )و✧*｡";

      }

    }


    setInterval(
      updateLoadingMessage,
      1000
    );


    updateLoadingMessage();


    // ==================================================
    // แสดง Error
    // ==================================================

    function showError(
      title,
      message
    ) {

      finished = true;


      cleanup();


      document.body.innerHTML = `

        <div class="loading-card">

          <div class="cute-icon">
            🥺
          </div>

          <div class="loading-title">
            ${title}
          </div>

          <div class="loading-message">
            ${message}
          </div>

        </div>

      `;

    }


    // ==================================================
    // Cleanup request ปัจจุบัน
    // ==================================================

    function cleanupCurrentRequest() {

      if (attemptTimeout) {

        clearTimeout(
          attemptTimeout
        );

        attemptTimeout = null;

      }


      if (currentScript) {

        currentScript.remove();

        currentScript = null;

      }

    }


    // ==================================================
    // Cleanup ทั้งหมด
    // ==================================================

    function cleanup() {

      cleanupCurrentRequest();


      if (retryTimer) {

        clearTimeout(
          retryTimer
        );

        retryTimer = null;

      }

    }


    // ==================================================
    // Retry
    // ==================================================

    function scheduleRetry() {

      if (finished) {
        return;
      }


      // ถ้าเกินเวลารวมแล้ว
      if (
        Date.now() - startTime >=
        TOTAL_TIMEOUT
      ) {

        showError(
          "เปิด link ไม่สำเร็จค่ะ",
          "ระบบใช้เวลานานเกินไป กรุณาลองเปิดใหม่อีกครั้งนะคะ"
        );

        return;

      }


      if (retryTimer) {
        return;
      }


      retryTimer =
        setTimeout(
          function() {

            retryTimer = null;

            requestLookup();

          },
          RETRY_DELAY
        );

    }


    // ==================================================
    // ขอข้อมูล Short Code
    // ==================================================

    function requestLookup() {

      if (finished) {
        return;
      }


      cleanupCurrentRequest();


      attemptNumber++;
      callbackCounter++;


      console.log(
        "Lookup attempt:",
        attemptNumber
      );


      // ------------------------------------------------
      // สร้าง callback ใหม่ทุกครั้ง
      // ------------------------------------------------

      const callbackName =
        "lookupCallback_" +
        Date.now() +
        "_" +
        callbackCounter;


      window[callbackName] =
        function(data) {

          console.log(
            "Lookup result:",
            data
          );


          if (finished) {
            return;
          }


          finished = true;


          cleanup();


          delete window[callbackName];


          // --------------------------------------------
          // เปิด Long URL
          // --------------------------------------------

          if (
            data &&
            data.success &&
            data.longUrl
          ) {

            window.location.replace(
              data.longUrl
            );

            return;

          }


          // --------------------------------------------
          // ไม่พบ Short Code
          // --------------------------------------------

          showError(
            "ไม่พบ link นี้ค่ะ",
            "Short URL นี้อาจไม่มีอยู่ หรือถูกลบไปแล้ว"
          );

        };


      // ==================================================
      // สร้าง JSONP Script
      // ==================================================

      const script =
        document.createElement(
          "script"
        );


      currentScript =
        script;


      script.id =
        callbackName;


      // ------------------------------------------------
      // เพิ่ม timestamp เพื่อป้องกัน cache
      // ------------------------------------------------

      const cacheBuster =
        Date.now();


      script.src =
        API_URL +
        "?code=" +
        encodeURIComponent(code) +
        "&callback=" +
        encodeURIComponent(callbackName) +
        "&t=" +
        cacheBuster;


      // ==================================================
      // กรณี Browser แจ้ง Error
      // ==================================================

      script.onerror =
        function() {

          if (finished) {
            return;
          }


          console.log(
            "Lookup request error. Retrying..."
          );


          delete window[callbackName];


          cleanupCurrentRequest();


          scheduleRetry();

        };


      // ==================================================
      // Timeout ของ request รอบนี้
      // ==================================================

      attemptTimeout =
        setTimeout(
          function() {

            if (finished) {
              return;
            }


            console.log(
              "Lookup request timeout. Retrying..."
            );


            delete window[callbackName];


            cleanupCurrentRequest();


            scheduleRetry();

          },
          REQUEST_TIMEOUT
        );


      // ==================================================
      // เริ่ม request
      // ==================================================

      document.body.appendChild(
        script
      );

    }


    // ==================================================
    // Timeout รวมทั้งหมด
    // ==================================================

    setTimeout(
      function() {

        if (finished) {
          return;
        }


        finished = true;


        cleanup();


        showError(
          "เปิด link ไม่สำเร็จค่ะ",
          "ระบบใช้เวลานานเกินไป กรุณาลองเปิดใหม่อีกครั้งนะคะ"
        );

      },
      TOTAL_TIMEOUT
    );


    // ==================================================
    // เริ่มทำงาน
    // ==================================================

    if (!code) {

      showError(
        "ไม่พบ link นี้ค่ะ",
        "กรุณาตรวจสอบ Short URL อีกครั้งนะคะ"
      );

    } else {

      requestLookup();

    }

  </script>

</body>

</html>
