<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>กำลังเปิด link...</title>

  <style>
    body {
      margin: 0;
      background: #fff;
      font-family: Arial, sans-serif;
      color: #555;
    }

    .loading-box {
      text-align: center;
      margin-top: 80px;
      padding: 20px;
    }

    .cute-icon {
      font-size: 42px;
      animation: float 1.8s ease-in-out infinite;
      display: inline-block;
    }

    .loading-title {
      margin-top: 14px;
      font-size: 20px;
      font-weight: 600;
      color: #555;
    }

    .loading-message {
      margin-top: 10px;
      font-size: 15px;
      color: #888;
      min-height: 24px;
    }

    .dots {
      margin-top: 14px;
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #aaa;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .dots span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .dots span:nth-child(3) {
      animation-delay: 0.3s;
    }

    .elapsed {
      margin-top: 12px;
      font-size: 12px;
      color: #aaa;
    }

    @keyframes bounce {
      0%, 60%, 100% {
        transform: translateY(0);
      }

      30% {
        transform: translateY(-7px);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }
  </style>
</head>

<body>

  <div class="loading-box" id="loadingBox">
    <div class="cute-icon">🐾</div>

    <div class="loading-title">
      กำลังเปิด link...
    </div>

    <div class="loading-message" id="loadingMessage">
      กรุณารอสักครู่นะคะ
    </div>

    <div class="dots">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="elapsed" id="elapsed">
      0 วินาที
    </div>
  </div>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbyX4QKp8avHVhcmALKy6VrTcopjpLX4c8PbXqX0pNis6RMDLy7eSmNka6NdEiylzopWfw/exec";

    const path = window.location.pathname;

    const code =
      path.split("/").filter(Boolean).pop();

    console.log("Short code:", code);

    const loadingMessage =
      document.getElementById("loadingMessage");

    const elapsedElement =
      document.getElementById("elapsed");

    const startTime = Date.now();

    let retryTimer = null;
    let timeoutTimer = null;
    let finished = false;

    function updateLoadingMessage() {
      if (finished) return;

      const seconds =
        Math.floor((Date.now() - startTime) / 1000);

      elapsedElement.textContent =
        seconds + " วินาที";

      if (seconds < 12) {
        loadingMessage.textContent =
          "กำลังเปิด link ให้ค่ะ ✧｡٩(ˊᗜˋ )و✧*｡";
      } else if (seconds < 24) {
        loadingMessage.textContent =
          "กำลังเตรียมหน้าเว็บให้ค่ะ ✧｡٩(ˊᗜˋ )و✧*｡";
      } else if (seconds < 36) {
        loadingMessage.textContent =
          "ยังดำเนินการอยู่ค่ะ อีกนิดเดียวนะคะ ✧｡٩(ˊᗜˋ )و✧*｡";
      } else {
        loadingMessage.textContent =
          "ระบบใช้เวลานานกว่าปกตินิดหน่อยค่ะ ✧｡٩(ˊᗜˋ )و✧*｡";
      }
    }

    setInterval(updateLoadingMessage, 1000);
    updateLoadingMessage();

    function showError(title, message) {
      finished = true;

      document.body.innerHTML = `
        <div style="
          text-align:center;
          margin-top:80px;
          padding:20px;
          font-family:Arial,sans-serif;
          color:#555;
        ">
          <div style="
            font-size:42px;
            margin-bottom:15px;
          ">🥺</div>

          <h2 style="
            margin-bottom:10px;
            font-size:20px;
          ">${title}</h2>

          <p style="
            color:#888;
            font-size:15px;
          ">${message}</p>
        </div>
      `;
    }

    function cleanup() {
      if (retryTimer) {
        clearTimeout(retryTimer);
        retryTimer = null;
      }

      if (timeoutTimer) {
        clearTimeout(timeoutTimer);
        timeoutTimer = null;
      }
    }

    function requestLookup() {
      if (finished) return;

      const callbackName =
        "lookupCallback_" + Date.now();

      window[callbackName] = function(data) {
        console.log("Lookup result:", data);

        if (finished) return;

        finished = true;
        cleanup();

        delete window[callbackName];

        const script =
          document.getElementById(callbackName);

        if (script) {
          script.remove();
        }

        if (data.success && data.longUrl) {
          window.location.replace(data.longUrl);
          return;
        }

        showError(
          "ไม่พบ link นี้ค่ะ",
          "Short URL นี้อาจไม่มีอยู่ หรือถูกลบไปแล้ว"
        );
      };

      const script =
        document.createElement("script");

      script.id = callbackName;

      script.src =
        API_URL +
        "?code=" +
        encodeURIComponent(code) +
        "&callback=" +
        encodeURIComponent(callbackName);

      script.onerror = function() {
        if (finished) return;

        console.log("Lookup request error. Retrying...");

        delete window[callbackName];

        script.remove();

        retryTimer = setTimeout(function() {
          requestLookup();
        }, 1000);
      };

      document.body.appendChild(script);
    }

    requestLookup();

    timeoutTimer = setTimeout(function() {
      if (finished) return;

      finished = true;
      cleanup();

      showError(
        "เปิด link ไม่สำเร็จค่ะ",
        "ระบบใช้เวลานานเกินไป กรุณาลองเปิดใหม่อีกครั้งนะคะ"
      );
    }, 45000);
  </script>

</body>

</html>
